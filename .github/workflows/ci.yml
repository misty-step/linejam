name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    # Every PR needs merge-gate, including documentation-only changes.
  # Release requires a successful CI receipt for the exact current master SHA.
  # Documentation-only merges must receive that receipt too.
  push:
    branches: [master]
  # Dispatch the same full gate explicitly for token-created release PRs,
  # without relying on automatic pull_request workflow execution.
  workflow_dispatch:
    inputs:
      release_pr:
        description: Open Landmark release PR number
        type: string
        required: true
      expected_sha:
        description: Exact release PR head SHA to verify
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CI_CLERK_JWT_ISSUER_DOMAIN || secrets.CLERK_JWT_ISSUER_DOMAIN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENABLED: '1'
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: test
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The schema sequencing guard compares HEAD with the PR merge base.
          fetch-depth: 0

      - name: Bind release dispatch to its PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/landmark/release" ]]
          [[ "$RELEASE_PR" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR" |
            jq -e --arg sha "$GITHUB_SHA" --arg expected "$EXPECTED_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .state == "open" and .base.ref == "master" and
              .head.ref == "landmark/release" and .head.repo.full_name == $repo and
              .head.sha == $expected and $expected == $sha'

      - name: Check schema migration sequencing
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
        run: >-
          node scripts/ci/check-schema-migration-sequencing.mjs
          "origin/$PR_BASE_REF"

      - name: Set NEXT_PUBLIC_CONVEX_URL fallback
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL=http://localhost:8187" >> "$GITHUB_ENV"
          fi

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: ./scripts/ci/dagger-call.sh format-check

      - name: Lint
        run: ./scripts/ci/dagger-call.sh lint

      - name: Type check
        run: ./scripts/ci/dagger-call.sh typecheck

      - name: Provider retirement check
        run: ./scripts/ci/dagger-call.sh provider-retirement

      - name: Secret scan
        run: ./scripts/ci/dagger-call.sh secret-scan

      - name: Security audit
        run: ./scripts/ci/dagger-call.sh audit

  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality-gates]
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CI_CLERK_SECRET_KEY || secrets.CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CI_CLERK_JWT_ISSUER_DOMAIN || secrets.CLERK_JWT_ISSUER_DOMAIN }}
      PLAYWRIGHT_CLERK_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_CLERK_TEST_EMAIL }}
      PLAYWRIGHT_REQUIRE_AUTH_E2E: '1'
      GUEST_TOKEN_SECRET: ${{ secrets.GUEST_TOKEN_SECRET }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENABLED: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set NEXT_PUBLIC_CONVEX_URL fallback
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL=http://localhost:8187" >> "$GITHUB_ENV"
          fi

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: ./scripts/ci/dagger-call.sh unit-test

      - name: Build check
        run: ./scripts/ci/dagger-call.sh build-check

  worker-images:
    name: Worker Routes, Images & Guest QA
    runs-on: [self-hosted, hetzner-ci, linejam-ci]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LINEJAM_LOCAL: '1'
      NEXT_PUBLIC_LINEJAM_LOCAL: '1'
      LINEJAM_DEPLOY_ENVIRONMENT: development
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:8787/backend
      NEXT_PUBLIC_SENTRY_ENABLED: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      GUEST_TOKEN_SECRET: isolated-worker-image-build-only-0000000000
      CIRCLE_NODE_TOTAL: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - run: pnpm build:cf
      - run: pnpm test:worker-routes
      - run: pnpm test:worker-images
      - run: pnpm exec playwright install chromium --with-deps
      - name: Run isolated guest QA
        id: qa
        run: pnpm test:worker-routes --game

      - name: Upload isolated guest QA evidence
        if: always() && steps.qa.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: isolated-guest-qa
          # Raw logs, JSON results and network traces can contain guest tokens.
          # Upload only the source receipt, values-free verdict and local UI media.
          path: |
            .qa/worker/receipt.json
            .qa/worker/qa/verdict.json
            .qa/worker/qa/evidence/*.png
            .qa/worker/qa/evidence/raw-video/*.webm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: E2E Mirror
    runs-on: [self-hosted, hetzner-ci, linejam-ci]
    timeout-minutes: 25
    needs: [quality-gates]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CI_CLERK_SECRET_KEY || secrets.CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CI_CLERK_JWT_ISSUER_DOMAIN || secrets.CLERK_JWT_ISSUER_DOMAIN }}
      PLAYWRIGHT_CLERK_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_CLERK_TEST_EMAIL }}
      PLAYWRIGHT_REQUIRE_AUTH_E2E: '1'
      GUEST_TOKEN_SECRET: ${{ secrets.GUEST_TOKEN_SECRET }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENABLED: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set NEXT_PUBLIC_CONVEX_URL fallback
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL=http://localhost:8187" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify signed guest throttle is deployed
        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/convex/probe-signed-throttle-ready.mjs

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run E2E mirror
        run: ./scripts/ci/dagger-call.sh e2e

  # Artifact capture is part of PR readiness: runtime errors, missing evidence
  # files, and unwaived packaging failures fail before merge-gate.
  qa-evidence:
    name: QA Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality-gates]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CI_CLERK_SECRET_KEY || secrets.CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CI_CLERK_JWT_ISSUER_DOMAIN || secrets.CLERK_JWT_ISSUER_DOMAIN }}
      GUEST_TOKEN_SECRET: ${{ secrets.GUEST_TOKEN_SECRET }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENABLED: '1'
      LINEJAM_BASE_URL: http://127.0.0.1:3333
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set NEXT_PUBLIC_CONVEX_URL fallback
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL=http://localhost:8187" >> "$GITHUB_ENV"
          fi

      - name: Set QA evidence paths
        run: |
          {
            echo "LINEJAM_EVIDENCE_DIR=$RUNNER_TEMP/linejam-evidence"
            echo "LINEJAM_EVIDENCE_SERVER_LOG=$RUNNER_TEMP/linejam-evidence-server.log"
            echo "LINEJAM_EVIDENCE_SERVER_PID=$RUNNER_TEMP/linejam-evidence-server.pid"
          } >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:check

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Install evidence encoders
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start app server
        run: |
          PORT=3333 pnpm start:next > "$LINEJAM_EVIDENCE_SERVER_LOG" 2>&1 &
          echo $! > "$LINEJAM_EVIDENCE_SERVER_PID"

          for _ in {1..60}; do
            if curl -sf "$LINEJAM_BASE_URL" >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          cat "$LINEJAM_EVIDENCE_SERVER_LOG"
          exit 1

      - name: Capture QA evidence
        run: pnpm evidence:guest-flow

      - name: Upload QA evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-evidence
          path: ${{ env.LINEJAM_EVIDENCE_DIR }}/
          retention-days: 14

      - name: Upload QA evidence raw test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-evidence-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload QA evidence server log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-evidence-server-log
          path: ${{ env.LINEJAM_EVIDENCE_SERVER_LOG }}
          retention-days: 14

      - name: Stop app server
        if: always()
        run: |
          if [ -f "$LINEJAM_EVIDENCE_SERVER_PID" ]; then
            kill "$(cat "$LINEJAM_EVIDENCE_SERVER_PID")" || true
          fi

  # The runner owns and tears down a fresh credential-free local stack.
  # It walks every live story and fails on unobserved criteria or cleanup failure.
  story-walk:
    name: story-walk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install supported Docker Compose and verify workspace prerequisites
        run: bash .exe/setup.sh
      - name: Walk every live story
        id: walk
        run: qa/walk --all
      - name: Upload sanitized story-walk evidence
        if: always() && steps.walk.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linejam-story-walk-${{ github.sha }}-${{ github.run_id }}
          path: target/walk/
          if-no-files-found: warn
          retention-days: 14

  # Rollup job — branch protection requires this exact name to merge.
  # Job name must match exactly. Workflow name: is a display label only.
  merge-gate:
    name: merge-gate
    runs-on: [self-hosted, hetzner-ci, linejam-ci]
    needs: [quality-gates, test-build, worker-images, e2e, qa-evidence]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.worker-images.result }}" != "success" ]]; then
            echo "Built Worker images must succeed; skipped is not acceptance."
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && \
             [[ "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "Release PR dispatch must run every merge-gate dependency."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
