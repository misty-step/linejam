name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    # Every PR needs merge-gate, including documentation-only changes.
  # Release requires a successful CI receipt for the exact current master SHA.
  # Documentation-only merges must receive that receipt too.
  push:
    branches: [master]
  # Dispatch the same full gate explicitly for token-created release PRs,
  # without relying on automatic pull_request workflow execution.
  workflow_dispatch:
    inputs:
      release_pr:
        description: Open Landmark release PR number
        type: string
        required: true
      expected_sha:
        description: Exact release PR head SHA to verify
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CI_CLERK_JWT_ISSUER_DOMAIN || secrets.CLERK_JWT_ISSUER_DOMAIN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENABLED: '1'
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: test
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The schema sequencing guard compares HEAD with the PR merge base.
          fetch-depth: 0

      - name: Bind release dispatch to its PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/landmark/release" ]]
          [[ "$RELEASE_PR" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR" |
            jq -e --arg sha "$GITHUB_SHA" --arg expected "$EXPECTED_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .state == "open" and .base.ref == "master" and
              .head.ref == "landmark/release" and .head.repo.full_name == $repo and
              .head.sha == $expected and $expected == $sha'

      - name: Check schema migration sequencing
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
        run: >-
          node scripts/ci/check-schema-migration-sequencing.mjs
          "origin/$PR_BASE_REF"

      - name: Set NEXT_PUBLIC_CONVEX_URL fallback
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL=http://localhost:8187" >> "$GITHUB_ENV"
          fi

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: ./scripts/ci/dagger-call.sh format-check

      - name: Lint
        run: ./scripts/ci/dagger-call.sh lint

      - name: Type check
        run: ./scripts/ci/dagger-call.sh typecheck

      - name: Provider retirement check
        run: ./scripts/ci/dagger-call.sh provider-retirement

      - name: Secret scan
        run: ./scripts/ci/dagger-call.sh secret-scan

      - name: Security audit
        run: ./scripts/ci/dagger-call.sh audit

  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality-gates]
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CI_CLERK_SECRET_KEY || secrets.CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CI_CLERK_JWT_ISSUER_DOMAIN || secrets.CLERK_JWT_ISSUER_DOMAIN }}
      PLAYWRIGHT_CLERK_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_CLERK_TEST_EMAIL }}
      PLAYWRIGHT_REQUIRE_AUTH_E2E: '1'
      GUEST_TOKEN_SECRET: ${{ secrets.GUEST_TOKEN_SECRET }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENABLED: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set NEXT_PUBLIC_CONVEX_URL fallback
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL=http://localhost:8187" >> "$GITHUB_ENV"
          fi

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: ./scripts/ci/dagger-call.sh unit-test

      - name: Build check
        run: ./scripts/ci/dagger-call.sh build-check

  # Additive, secret-free acceptance. The CLI owns a fresh isolated app/backend,
  # guest browser loop, and runtime evidence; it does not replace Clerk E2E.
  local-guest-qa:
    name: Isolated Guest QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install supported Docker Compose
        env:
          COMPOSE_VERSION: v5.5.1
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) asset="docker-compose-linux-x86_64" ;;
            aarch64|arm64) asset="docker-compose-linux-aarch64" ;;
            *)
              echo "Unsupported architecture: $arch" >&2
              exit 1
              ;;
          esac
          curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/${asset}" \
            -o /tmp/docker-compose
          chmod 755 /tmp/docker-compose
          sudo install -D /tmp/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
          installed="$(docker compose version --short)"
          if [[ "$installed" != "${COMPOSE_VERSION#v}" ]]; then
            echo "Expected Docker Compose ${COMPOSE_VERSION#v}, found ${installed}" >&2
            exit 1
          fi

      - name: Run isolated guest QA
        id: qa
        run: node scripts/local/cli.mjs qa --project ci

      - name: Upload isolated guest QA evidence
        if: always() && steps.qa.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: isolated-guest-qa
          # Raw logs, JSON results and network traces can contain guest tokens.
          # Upload only the source receipt, values-free verdict and local UI media.
          path: |
            .qa/local/linejam-local-ci/receipt.json
            .qa/local/linejam-local-ci/artifacts/qa/verdict.json
            .qa/local/linejam-local-ci/artifacts/qa/evidence/*.png
            .qa/local/linejam-local-ci/artifacts/qa/evidence/raw-video/*.webm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Stop isolated guest stack
        if: always() && steps.qa.outcome != 'skipped'
        run: node scripts/local/cli.mjs down --project ci

  early-smoke:
    name: Early Selector Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-gates]
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CI_CLERK_JWT_ISSUER_DOMAIN || secrets.CLERK_JWT_ISSUER_DOMAIN }}
      GUEST_TOKEN_SECRET: ${{ secrets.GUEST_TOKEN_SECRET }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENABLED: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set NEXT_PUBLIC_CONVEX_URL fallback
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL=http://localhost:8187" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify signed guest throttle is deployed
        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/convex/probe-signed-throttle-ready.mjs

      - name: Build
        run: pnpm build:check

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run early selector smoke
        run: pnpm test:e2e:early-smoke

  e2e:
    name: E2E Mirror
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality-gates]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CI_CLERK_SECRET_KEY || secrets.CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CI_CLERK_JWT_ISSUER_DOMAIN || secrets.CLERK_JWT_ISSUER_DOMAIN }}
      PLAYWRIGHT_CLERK_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_CLERK_TEST_EMAIL }}
      PLAYWRIGHT_REQUIRE_AUTH_E2E: '1'
      GUEST_TOKEN_SECRET: ${{ secrets.GUEST_TOKEN_SECRET }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENABLED: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set NEXT_PUBLIC_CONVEX_URL fallback
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL=http://localhost:8187" >> "$GITHUB_ENV"
          fi

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run E2E mirror
        run: ./scripts/ci/dagger-call.sh e2e

  # Artifact capture is part of PR readiness: runtime errors, missing evidence
  # files, and unwaived packaging failures fail before merge-gate.
  qa-evidence:
    name: QA Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality-gates]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CI_CLERK_SECRET_KEY || secrets.CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CI_CLERK_JWT_ISSUER_DOMAIN || secrets.CLERK_JWT_ISSUER_DOMAIN }}
      GUEST_TOKEN_SECRET: ${{ secrets.GUEST_TOKEN_SECRET }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENABLED: '1'
      LINEJAM_BASE_URL: http://127.0.0.1:3333
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set NEXT_PUBLIC_CONVEX_URL fallback
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL=http://localhost:8187" >> "$GITHUB_ENV"
          fi

      - name: Set QA evidence paths
        run: |
          {
            echo "LINEJAM_EVIDENCE_DIR=$RUNNER_TEMP/linejam-evidence"
            echo "LINEJAM_EVIDENCE_SERVER_LOG=$RUNNER_TEMP/linejam-evidence-server.log"
            echo "LINEJAM_EVIDENCE_SERVER_PID=$RUNNER_TEMP/linejam-evidence-server.pid"
          } >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:check

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Install evidence encoders
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start app server
        run: |
          PORT=3333 pnpm start:next > "$LINEJAM_EVIDENCE_SERVER_LOG" 2>&1 &
          echo $! > "$LINEJAM_EVIDENCE_SERVER_PID"

          for _ in {1..60}; do
            if curl -sf "$LINEJAM_BASE_URL" >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          cat "$LINEJAM_EVIDENCE_SERVER_LOG"
          exit 1

      - name: Capture QA evidence
        run: pnpm evidence:guest-flow

      - name: Upload QA evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-evidence
          path: ${{ env.LINEJAM_EVIDENCE_DIR }}/
          retention-days: 14

      - name: Upload QA evidence raw test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-evidence-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload QA evidence server log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-evidence-server-log
          path: ${{ env.LINEJAM_EVIDENCE_SERVER_LOG }}
          retention-days: 14

      - name: Stop app server
        if: always()
        run: |
          if [ -f "$LINEJAM_EVIDENCE_SERVER_PID" ]; then
            kill "$(cat "$LINEJAM_EVIDENCE_SERVER_PID")" || true
          fi

  # Rollup job — branch protection requires this exact name to merge.
  # Job name must match exactly. Workflow name: is a display label only.
  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    needs:
      [quality-gates, test-build, local-guest-qa, early-smoke, e2e, qa-evidence]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.local-guest-qa.result }}" != "success" ]]; then
            echo "Isolated guest QA must succeed; skipped is not acceptance."
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && \
             [[ "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "Release PR dispatch must run every merge-gate dependency."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
