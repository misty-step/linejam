name: nightly

# CI and the scheduled run on master walk every live story.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install supported Docker Compose and verify workspace prerequisites
        run: bash .exe/setup.sh
      - name: Walk every live story
        id: walk
        run: qa/walk --all
      - name: Upload sanitized full-walk evidence
        if: always() && steps.walk.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linejam-nightly-walk-${{ github.sha }}-${{ github.run_id }}
          path: target/walk/
          if-no-files-found: warn
          retention-days: 30
      - name: Open or update the nightly failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly story walk failed"
          body="Owner: Linejam maintainers. The full story walk failed on ${GITHUB_SHA}. Run: ${RUN_URL}. If the walk ran, its linejam-nightly-walk artifact holds sanitized receipts and evidence; a failure before the walk leaves the step logs. Refs MIS-150."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq '[.[] | select(.title == "Nightly story walk failed") | .number][0] // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
