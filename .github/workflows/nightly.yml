name: nightly

# PRs walk affected stories; the scheduled run on master walks every live story.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HARNESS_SHA: "5834348e2a0cd70404ca136dcf887c680dcf02ab"
      BUN_URL: https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64-baseline.zip
      BUN_SHA256: c678040f14fe0440eb839d37cbd0ce4c051a32da72806ac97de6a6aab6bf728f
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install supported Docker Compose and verify workspace prerequisites
        run: bash .exe/setup.sh
      - name: Fetch pinned foundation checker and Bun
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/foundation"
          mkdir -p "$root/checker" "$root/runtime"
          git init --quiet --initial-branch=checker "$root/checker"
          git -C "$root/checker" fetch --quiet --no-tags --depth=1 https://github.com/misty-step/harness.git "$HARNESS_SHA"
          git -C "$root/checker" checkout --quiet --detach "$HARNESS_SHA"
          test "$(git -C "$root/checker" rev-parse HEAD)" = "$HARNESS_SHA"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 3 --output "$root/runtime/bun.zip" "$BUN_URL"
          printf '%s  %s\n' "$BUN_SHA256" "$root/runtime/bun.zip" | sha256sum --check --strict
          unzip -q "$root/runtime/bun.zip" -d "$root/runtime"
      - name: Walk every live story
        id: walk
        run: |
          set -euo pipefail
          bun="$RUNNER_TEMP/foundation/runtime/bun-linux-x64-baseline/bun"
          checker="$RUNNER_TEMP/foundation/checker/agent-config/bin/foundation-check.ts"
          # The checker runs outside the checkout so Bun cannot load repository bunfig.toml.
          foundation() { (cd "$RUNNER_TEMP/foundation" && "$bun" --no-env-file --no-install "$checker" "$@" --repo "$GITHUB_WORKSPACE"); }
          foundation check
          qa/walk --all
          foundation receipt target/walk/walk-receipt.json --all
      - name: Upload sanitized full-walk evidence
        if: always() && steps.walk.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linejam-nightly-walk-${{ github.sha }}-${{ github.run_id }}
          path: target/walk/
          if-no-files-found: warn
          retention-days: 30
      - name: Open or update the nightly failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly story walk failed"
          body="Owner: Linejam maintainers. The full story walk failed on ${GITHUB_SHA}. Run: ${RUN_URL}. If the walk ran, its linejam-nightly-walk artifact holds sanitized receipts and evidence; a failure before the walk leaves the step logs. Refs MIS-150."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq '[.[] | select(.title == "Nightly story walk failed") | .number][0] // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
