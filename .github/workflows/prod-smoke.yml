name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      force_alert_test:
        description: Force the smoke result red after the real browser corpus passes
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      outcome: ${{ steps.smoke.outcome }}
      release_outcome: ${{ steps.release.outcome }}
      release: ${{ steps.deployment.outputs.release }}
    env:
      PLAYWRIGHT_BASE_URL: https://www.linejam.app
      PLAYWRIGHT_REQUIRE_AUTH_SMOKE: '1'
      LINEJAM_SMOKE_RUNNER: playwright
      LINEJAM_ENFORCE_SMOKE_URL_ALLOWLIST: '1'
      LINEJAM_ALLOWED_SMOKE_ORIGINS: https://www.linejam.app
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      PLAYWRIGHT_CLERK_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_CLERK_TEST_EMAIL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Resolve deployed Sentry release
        id: release
        continue-on-error: true
        run: node scripts/ops/resolve-sentry-release.mjs

      - name: Export deployed release
        id: deployment
        run: echo "release=$NEXT_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run production smoke
        id: smoke
        if: always()
        env:
          LINEJAM_FORCE_ALERT_TEST: ${{ inputs.force_alert_test && '1' || '0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/linejam-smoke"
          set +e
          pnpm smoke:run > "$RUNNER_TEMP/linejam-smoke/stdout.log" 2> "$RUNNER_TEMP/linejam-smoke/stderr.log"
          code=$?
          if [ "$LINEJAM_FORCE_ALERT_TEST" = "1" ] && [ "$code" -eq 0 ]; then
            echo "forced alert drill: tests/e2e/prod-smoke.spec.ts" >> "$RUNNER_TEMP/linejam-smoke/stderr.log"
            code=1
          fi
          cat "$RUNNER_TEMP/linejam-smoke/stdout.log"
          cat "$RUNNER_TEMP/linejam-smoke/stderr.log" >&2
          # The linked artifacts retain full diagnostics. Extract only the
          # static spec path plus optional line/column from Playwright output;
          # stdout, account data, and provider responses never enter the alert
          # plane.
          detail="$(
            grep -Eho 'tests/e2e/prod-smoke\.spec\.ts(:[0-9]+){0,2}' \
              "$RUNNER_TEMP/linejam-smoke/stdout.log" \
              "$RUNNER_TEMP/linejam-smoke/stderr.log" | tail -n 1 || true
          )"
          if [ -z "$detail" ]; then
            detail="tests/e2e/prod-smoke.spec.ts"
          fi
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload production smoke logs
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: production-smoke-logs
          path: ${{ runner.temp }}/linejam-smoke/
          retention-days: 14

      - name: Upload production Playwright artifacts
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: production-smoke-playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize player health
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: |
          {
            echo "## Production player health"
            echo
            echo "- Browser smoke: ${SMOKE_OUTCOME}"
            echo "- Deployed release receipt: ${RELEASE_OUTCOME}"
            echo "- Sentry reporting and release bookkeeping have independent results."
          } >> "$GITHUB_STEP_SUMMARY"

  reporting:
    name: Sentry player-health reporting
    needs: smoke
    if: always() && github.ref == 'refs/heads/master'
    # Observability delivery must not turn healthy Linejam smoke red.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENABLED: '1'
      LINEJAM_DEPLOY_ENVIRONMENT: production
      NEXT_DEPLOYMENT_ID: ${{ needs.smoke.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only browser outcomes count, including runs before the job split.
      - name: Determine consecutive-failure streak
        id: streak
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ needs.smoke.outputs.outcome }}
        run: |
          count="$(node scripts/ops/count-consecutive-prod-smoke-failures.mjs "$SMOKE_OUTCOME")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Report status to Sentry
        env:
          SENTRY_AUTOMATION_PROVENANCE_SECRET: ${{ secrets.SENTRY_AUTOMATION_PROVENANCE_SECRET }}
          LINEJAM_MONITOR_SLUG: linejam-production-smoke
          LINEJAM_RELEASE_RESOLUTION_OUTCOME: ${{ needs.smoke.outputs.release_outcome }}
          LINEJAM_MONITOR_OUTCOME: ${{ needs.smoke.outputs.outcome }}
          LINEJAM_MONITOR_CONSECUTIVE_FAILURES: ${{ steps.streak.outputs.count }}
        run: node scripts/ops/report-sentry-check-in.mjs

      - name: Enforce deployed release attribution
        if: always() && needs.smoke.outputs.release_outcome != 'success'
        run: |
          echo "::error::Sentry reporting could not resolve the commit served by /api/health; see the independent player-health result."
          exit 1

      - name: Summarize reporting
        if: always()
        env:
          SMOKE_OUTCOME: ${{ needs.smoke.outputs.outcome }}
          STREAK_COUNT: ${{ steps.streak.outputs.count }}
          REPORTING_STATUS: ${{ job.status }}
        run: |
          if [ "$REPORTING_STATUS" != "success" ]; then
            echo "::warning::Sentry player-health reporting ${REPORTING_STATUS}; see the browser smoke result."
          fi
          {
            echo "## Sentry player-health reporting"
            echo
            echo "- Reporting: ${REPORTING_STATUS}"
            echo "- Browser smoke: ${SMOKE_OUTCOME}"
            echo "- Consecutive browser failures: ${STREAK_COUNT}"
            echo "- A reporting failure is an observability incident, not a player-health result."
          } >> "$GITHUB_STEP_SUMMARY"
