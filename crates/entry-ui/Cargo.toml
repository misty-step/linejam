[package]
name = "linejam-entry-ui"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.19", features = ["csr"] }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
gloo-events = "0.2"
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "Document", "Element", "Event", "HtmlElement", "KeyboardEvent", "Node", "Window"] }
