packages:
  - vendor/parlor/packages/*
  - vendor/parlor/integrations/*

# MIS-184: keep a new sign-in pending until Convex returns its own verdict.
patchedDependencies:
  convex@1.42.3: patches/convex@1.42.3.patch

ignoredBuiltDependencies:
  - '@clerk/shared'
  - esbuild
  - lefthook
  - sharp
  - unrs-resolver

# promptfoo's optional @openai/codex-security integration resolves
# extract-zip@2.0.1, which carries two unfixed HIGH advisories
# (GHSA-7pqw-9j4j-h8q3, GHSA-jmr9-qjv8-65gv). Linejam does not use that
# integration (agentic QA grades via openai:gpt-4.1-mini), so skip it.
# Revisit when extract-zip ships a patched release or promptfoo drops it.
ignoredOptionalDependencies:
  - '@openai/codex-security'
  # Unused optional Java keystore support pulls unfixed node-forge (GHSA-86w9-cpqp-85rv).
  - jks-js

# Security floors apply only below the fix and preserve the patched release family.
# Newer parent requests outside the vulnerable range remain unmodified.
overrides:
  '@clerk/shared@>=3 <3.47.7': ^3.47.7
  '@clerk/shared@>=4 <4.25.5': ^4.25.5
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': ^1.31.0
  '@simple-git/argv-parser@<2.0.1': ^2.0.1
  ajv@>=6 <6.14.0: ^6.14.0
  esbuild@<0.28.1: ^0.28.1
  flatted@<3.4.2: ^3.4.2
  handlebars@<4.7.10: ^4.7.10
  lodash@<4.18.1: ^4.18.1
  lodash-es@<4.18.1: ^4.18.1
  minimatch@<10.2.5: ^10.2.5
  brace-expansion@<5.0.11: ^5.0.11
  picomatch@>=2 <2.3.2: ^2.3.2
  picomatch@>=3 <3.0.2: ^3.0.2
  picomatch@>=4 <4.0.4: ^4.0.4
  protobufjs@<7.6.3: ^7.6.3
  form-data@<4.0.6: ^4.0.6
  hono@<4.13.2: ^4.13.2
  '@hono/node-server@<1.19.17': ^1.19.17
