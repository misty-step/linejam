packages:
  - vendor/parlor/packages/*
  - vendor/parlor/integrations/*

# MIS-184: keep a new sign-in pending until Convex returns its own verdict.
patchedDependencies:
  convex@1.42.3: patches/convex@1.42.3.patch

ignoredBuiltDependencies:
  - '@clerk/shared'
  - esbuild
  - lefthook
  - sharp
  - unrs-resolver

# promptfoo's optional @openai/codex-security integration resolves
# extract-zip@2.0.1, which carries two unfixed HIGH advisories
# (GHSA-7pqw-9j4j-h8q3, GHSA-jmr9-qjv8-65gv). Linejam does not use that
# integration (agentic QA grades via openai:gpt-4.1-mini), so skip it.
# Revisit when extract-zip ships a patched release or promptfoo drops it.
ignoredOptionalDependencies:
  - '@openai/codex-security'
  # Unused optional Java keystore support pulls unfixed node-forge (GHSA-86w9-cpqp-85rv).
  - jks-js

# Security floors apply only below the fix; newer parent resolutions stay intact.
overrides:
  '@clerk/shared@>=3 <3.47.7': '>=3.47.7'
  '@clerk/shared@>=4 <4.25.5': '>=4.25.5'
  ajv@<6.14.0: '>=6.14.0'
  esbuild@<0.28.1: '>=0.28.1'
