  # braces@3.0.3 (GHSA-vfj7-8cjw-p6xm) has no fixed release and no current
  # micromatch, fast-glob, semantic-release or Next lint plugin avoids it (#604).
  # Route each dependent to a braces-free stand-in for the API it calls.
  # Proof and removal trigger: docs/adr/0014-vendored-braces-free-stand-ins.md.
  '@next/eslint-plugin-next>fast-glob': file:tools/braces-free/fast-glob
  '@semantic-release/commit-analyzer>micromatch': file:tools/braces-free/micromatch
  semantic-release>micromatch: file:tools/braces-free/micromatch
