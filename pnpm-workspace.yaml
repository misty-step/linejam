packages:
  - vendor/parlor/packages/*
  - vendor/parlor/integrations/*

ignoredBuiltDependencies:
  - '@clerk/shared'
  - esbuild
  - lefthook
  - sharp
  - unrs-resolver

# promptfoo's optional @openai/codex-security integration resolves
# extract-zip@2.0.1, which carries two unfixed HIGH advisories
# (GHSA-7pqw-9j4j-h8q3, GHSA-jmr9-qjv8-65gv). Linejam does not use that
# integration (agentic QA grades via openai:gpt-4.1-mini), so skip it.
# Revisit when extract-zip ships a patched release or promptfoo drops it.
ignoredOptionalDependencies:
  - '@openai/codex-security'

overrides:
  '@clerk/shared@3': ^3.47.7
  '@clerk/shared@4': ^4.25.5
  ajv@6: ^6.14.0
  esbuild@<0.28.1: '>=0.28.1'
  flatted: 3.4.2
  handlebars: 4.7.9
  lodash: 4.18.1
  lodash-es: 4.18.1
  minimatch: 10.2.5
  brace-expansion: 5.0.9
  picomatch: 4.0.4
  protobufjs: ^7.6.3
  form-data: 4.0.6
  hono: 4.13.2
  '@hono/node-server': 1.19.17
  ip-address: 10.5.0
  dompurify: 3.4.13
  adm-zip: 0.6.1
  sharp: 0.35.4
  rollup: 4.59.0
  undici: 7.29.0
  vite: '>=7.3.5 <8'
  ws: 8.21.0
