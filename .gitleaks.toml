# gitleaks config for Linejam
# Extends the default rule set; adds project-specific rules.

extends = "gitleaks:default"

[[rules]]
id = "linejam-guest-token-secret"
description = "Guest token signing secret or operator key assigned a literal value"
regex = '''(GUEST_TOKEN_SECRET|LINEJAM_ADMIN_KEY)\s*[:=]\s*["']?[A-Za-z0-9_\-]{32,}'''
keywords = ["GUEST_TOKEN_SECRET", "LINEJAM_ADMIN_KEY"]

[rules.allowlist]
description = "Fixed test-only values used inside workerd tests"
regexes = ['''local-test-[a-z]+-(secret|key)-0123456789abcdef''']
paths = ['''vitest\.config\.ts''', '''tests/.*''']
